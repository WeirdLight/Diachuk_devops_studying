name: Full CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  # Етап 1: Тестування
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Unit Tests
        run: python -m unittest test_network_monitor.py

  # Етап 2: Збирання проєкту (build)
  build:
    runs-on: ubuntu-latest
    needs: test # Запуститься тільки після успішного тест-паку
    steps:
      - name: Simulated Build Step
        run: |
          echo "Compiling and packaging the application..."
          echo "Artifacts created successfully."

  # Етап 3: Розгортання на тестове середовище (deploy_staging)
  deploy_staging:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Simulated Deploy to Staging
        run: |
          echo "Deploying application to Staging server..."
          echo "Application is live on staging.local"

  # Етап 4: Верифікація та smoke-тести на staging (verify_staging)
  verify_staging:
    runs-on: ubuntu-latest
    needs: deploy_staging
    steps:
      - name: Simulated Verification
        run: |
          echo "Running Integration and Smoke tests against Staging..."
          echo "Health check: HTTP 200 OK. Staging is stable."

  # Етап 5: Фінальне розгортання на продакшн (deploy_production)
  deploy_production:
    runs-on: ubuntu-latest
    needs: verify_staging
    steps:
      - name: Simulated Deploy to Production
        run: |
          echo "Deploying application to Production server..."
          echo "Deployment successful! Version is live for users."
