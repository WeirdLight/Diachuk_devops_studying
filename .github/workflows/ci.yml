name: CI Pipeline

# Налаштування запуску: пайплайн тригериться лише при створенні або оновленні Pull Request у main
on:
  pull_request:
    branches: [ main ]

jobs:
  test-and-scan:
    runs-on: ubuntu-latest

    steps:
    # 1. Стягуємо код репозиторію на віртуальну машину GitHub
    - name: Checkout code
      uses: actions/checkout@v4

    # 2. Налаштовуємо середовище Python
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-state: '3.11'

    # 3. Встановлюємо залежності та інструменти для аналізу
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flake8 bandit

    # 4. Крок Linting (Перевірка стилю коду за допомогою flake8)
    - name: Run Linting (flake8)
      run: |
        # stop the build if there are Python syntax errors or undefined names
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        # exit-zero treats all errors as warnings.
        flake8 . --count --max-line-length=127 --statistics

    # 5. Крок Security Scan / Static Analysis (Пошук вразливостей за допомогою Bandit)
    - name: Run Security Scan (Bandit)
      run: |
        bandit -r . -ll

    # 6. Крок Unit-тестів (Пайплайн автоматично впаде, якщо тести повернуть помилку)
    - name: Run Unit Tests
      run: |
        python -m unittest test_network_monitor.py